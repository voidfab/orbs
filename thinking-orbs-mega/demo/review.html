<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thinking-orbs-mega — review gallery</title>
    <style>
      :root { color-scheme: dark; --bg: #111; --ink: #ececec; --muted: #888; --card: #1b1b1b; --line: #2a2a2a; }
      html[data-theme="light"] { color-scheme: light; --bg: #f4f4f3; --ink: #161616; --muted: #666; --card: #fff; --line: #ddd; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
      header { padding: 20px 24px 8px; max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
      p { margin: 0 0 12px; color: var(--muted); max-width: 68ch; }
      p a { color: inherit; }
      .links { display: flex; flex-wrap: wrap; gap: 12px 16px; }
      .links a { color: inherit; }
      .sizes { display: flex; gap: 6px; }
      .chip { background: var(--card); border: 1px solid var(--line); color: inherit; border-radius: 999px; padding: 2px 8px; font: inherit; cursor: pointer; }
      .chip.on { outline: 2px solid #7bf; }
      .tabs { display: flex; gap: 8px; margin: 10px 0 0; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 8px 24px 16px; max-width: 1100px; margin: 0 auto; }
      .bar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 8px 24px 40px; max-width: 1100px; margin: 0 auto; }
      .cell { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
      .cell.sel { outline: 2px solid #7bf; }
      .name { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
      .skin { width: 88px; height: 88px; display: grid; place-items: center; }
      .skin-list { max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; display: flex; flex-direction: column; gap: 18px; }
      .skin-row { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; gap: 16px; align-items: center; }
      .skin-meta { color: var(--muted); font-size: 13px; }
      .skin-meta strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
      .skin-phases { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 10px; }
      @media (max-width: 800px) {
        .skin-row { grid-template-columns: 1fr; }
        .skin-phases { grid-template-columns: repeat(2, 1fr); }
      }
      .stage { max-width: 1100px; margin: 0 auto; padding: 0 24px 32px; display: flex; align-items: center; gap: 24px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./review-main.tsx"></script>
  </body>
</html>
