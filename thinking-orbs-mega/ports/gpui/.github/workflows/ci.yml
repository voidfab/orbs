name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: System deps (GPUI / Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-x11-dev libssl-dev pkg-config \
            libvulkan-dev mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (library)
        run: cargo clippy --lib -- -D warnings

      - name: Tests (library)
        run: cargo test --lib

      - name: Package dry-run
        run: cargo package --allow-dirty --no-verify
