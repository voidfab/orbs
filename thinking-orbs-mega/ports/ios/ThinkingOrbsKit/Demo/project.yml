name: ThinkingOrbsDemo
options:
  bundleIdPrefix: com.michaelwdanko
  deploymentTarget:
    iOS: "16.0"
packages:
  ThinkingOrbs:
    path: ..
targets:
  ThinkingOrbsDemo:
    type: application
    platform: iOS
    sources:
      - ThinkingOrbsDemo
    dependencies:
      - package: ThinkingOrbs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelwdanko.ThinkingOrbsDemo
        PRODUCT_NAME: Thinking Orbs
        PRODUCT_MODULE_NAME: ThinkingOrbsApp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        INFOPLIST_KEY_CFBundleDisplayName: Thinking Orbs
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
  ThinkingOrbsDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ThinkingOrbsDemoUITests
    dependencies:
      - target: ThinkingOrbsDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelwdanko.ThinkingOrbsDemoUITests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ThinkingOrbsDemo:
    build:
      targets:
        ThinkingOrbsDemo: all
    run:
      config: Debug
    test:
      targets:
        - ThinkingOrbsDemoUITests
