name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Pi ${{ matrix.pi-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pi-version: ["0.82.1", "latest"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Pi
        run: npm install --global "@earendil-works/pi-coding-agent@${{ matrix.pi-version }}"

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Audit runtime dependencies
        run: npm audit --omit=peer --omit=dev

      - name: Smoke-load extension
        run: pi -e ./index.ts --list-models

  package:
    name: Package and isolated install
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and Pi
        run: |
          npm ci
          npm install --global @earendil-works/pi-coding-agent@latest

      - name: Build tarball
        run: |
          npm run check
          npm pack --ignore-scripts --json > pack.json

      - name: Inspect tarball
        run: |
          tarball=$(jq -r '.[0].filename' pack.json)
          tar -tzf "$tarball" | sort | tee package-contents.txt
          grep -qx 'package/index.ts' package-contents.txt
          grep -qx 'package/LICENSE' package-contents.txt
          grep -qx 'package/README.md' package-contents.txt
          grep -qx 'package/THIRD_PARTY_NOTICES.md' package-contents.txt
          grep -qx 'package/src/settings.ts' package-contents.txt
          if grep -Eq '^package/(test|scripts|node_modules)/' package-contents.txt; then
            echo 'Tarball contains development-only files' >&2
            exit 1
          fi

      - name: Install and load tarball in isolation
        run: |
          tarball="$GITHUB_WORKSPACE/$(jq -r '.[0].filename' pack.json)"
          isolated=$(mktemp -d)
          cd "$isolated"
          npm init --yes >/dev/null
          npm install "$tarball"
          pi -e "$isolated/node_modules/pi-thinking-orbs/index.ts" --list-models

      - uses: actions/upload-artifact@v4
        with:
          name: pi-thinking-orbs-package
          path: |
            pi-thinking-orbs-*.tgz
            package-contents.txt
          if-no-files-found: error
