<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>presence — conversation realms</title>
    <style>
      :root { color-scheme: dark; --bg: #111; --ink: #ececec; --muted: #888; --card: #1b1b1b; --line: #2a2a2a; }
      html[data-theme="light"] { color-scheme: light; --bg: #f4f4f3; --ink: #161616; --muted: #666; --card: #fff; --line: #ddd; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
      header { padding: 20px 24px 8px; max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
      p { margin: 0 0 12px; color: var(--muted); max-width: 72ch; }
      p a { color: inherit; }
      .tabs, .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
      .tabs { margin: 10px 0 0; }
      .bar { padding: 8px 24px 16px; max-width: 1100px; margin: 0 auto; }
      .bar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
      .chip { background: var(--card); border: 1px solid var(--line); color: inherit; border-radius: 999px; padding: 2px 10px; font: inherit; cursor: pointer; }
      .chip.on { outline: 2px solid #7bf; }
      .stage { max-width: 1100px; margin: 0 auto; padding: 8px 24px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
      .realm { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .realm strong { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      .meta { font-size: 12px; color: var(--muted); text-align: center; min-height: 2.6em; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 8px 24px 40px; max-width: 1100px; margin: 0 auto; }
      .cell { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
      .cell.sel { outline: 2px solid #7bf; }
      .name { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./review-main.tsx"></script>
  </body>
</html>
